name: Daily MLB schedule — Frozen Root

on:
  schedule:
    - cron: '17 7 * * *'
      timezone: 'America/Los_Angeles'
    - cron: '23 14 * * *'
      timezone: 'America/Los_Angeles'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/daily-mlb-schedule.yml'
      - 'scripts/update_schedule.py'

permissions:
  contents: write

concurrency:
  group: daily-mlb-schedule
  cancel-in-progress: false

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Get today's MLB schedule
        run: python scripts/update_schedule.py
      - name: Publish latest schedule
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schedule.json
          if git diff --cached --quiet; then
            echo "No schedule change"
            exit 0
          fi
          git commit -m "Daily MLB games: pick pending (schedule feed only)"
          git push
