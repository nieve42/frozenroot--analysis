name: Frozen Root NBA schedule

on:
  schedule:
    - cron: '1 0 * * *'
      timezone: 'America/Los_Angeles'
    - cron: '23 14 * * *'
      timezone: 'America/Los_Angeles'
    - cron: '17 * * * *'
      timezone: 'America/Los_Angeles'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/daily-nba-schedule.yml'
      - 'scripts/update_nba_schedule.py'
      - 'scripts/auto_sports_picks.py'

permissions:
  contents: write

concurrency:
  group: frozen-root-nba-schedule
  cancel-in-progress: false

jobs:
  update-nba-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Frozen Root site
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch today's NBA games, without generating picks
        run: python scripts/update_nba_schedule.py
      - name: Generate new frozen automatic NBA winners and projected scores
        run: python scripts/auto_sports_picks.py --sport nba
      - name: Publish NBA slate and completed-game win/loss results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nba-schedule.json auto-nba-picks.json nba-picks.json
          if git diff --cached --quiet; then
            echo "NBA schedule unchanged"
            exit 0
          fi
          git commit -m "Refresh NBA games and frozen automatic pregame score predictions"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin main; then
              echo "Published NBA schedule + frozen forecasts"
              exit 0
            fi
            echo "Concurrent update; retrying push (attempt $attempt)"
            sleep $((attempt * 4))
          done
          echo "Could not publish after retrying" >&2
          exit 1
