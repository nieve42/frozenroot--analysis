name: Frozen Root NFL schedule

on:
  schedule:
    - cron: '1 0 * * *'
      timezone: 'America/Los_Angeles'
    - cron: '23 14 * * *'
      timezone: 'America/Los_Angeles'
    - cron: '17 * * * *'
      timezone: 'America/Los_Angeles'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/daily-nfl-schedule.yml'
      - 'scripts/update_nfl_schedule.py'
      - 'scripts/auto_sports_picks.py'

permissions:
  contents: write

concurrency:
  group: frozen-root-nfl-schedule
  cancel-in-progress: false

jobs:
  update-nfl-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the website
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch NFL game schedule (no predictions)
        run: python scripts/update_nfl_schedule.py
      - name: Generate new frozen automatic NFL winners and projected scores
        run: python scripts/auto_sports_picks.py --sport nfl
      - name: Publish NFL slate and completed-game win/loss results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nfl-schedule.json auto-nfl-picks.json nfl-picks.json
          if git diff --cached --quiet; then
            echo "No changes to NFL schedule"
            exit 0
          fi
          git commit -m "Refresh NFL games and frozen automatic pregame score predictions"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin main; then
              echo "Published NFL schedule + frozen forecasts"
              exit 0
            fi
            echo "Concurrent update; retrying push (attempt $attempt)"
            sleep $((attempt * 4))
          done
          echo "Could not publish after retrying" >&2
          exit 1
