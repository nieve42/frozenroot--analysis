name: FrozenRoot data health check

on:
  schedule:
    # Hourly, after the NFL/NBA/NHL schedule refreshes at :17.
    - cron: '47 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/data-health-check.yml'
      - 'scripts/check_data_health.py'

permissions:
  contents: write

concurrency:
  group: frozen-root-health-check
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out FrozenRoot website
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit published sports files (read only)
        run: python scripts/check_data_health.py
      - name: Publish health report only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add health.json
          if git diff --cached --quiet; then
            echo "Health report has not changed"
            exit 0
          fi
          git commit -m "Refresh FrozenRoot automatic data health report"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin main; then
              echo "Published health report"
              exit 0
            fi
            echo "Concurrent update; retrying push (attempt $attempt)"
            sleep $((attempt * 4))
          done
          echo "Health report publication failed" >&2
          exit 1
