name: Frozen Root NHL schedule

on:
  schedule:
    - cron: '1 0 * * *'
      timezone: 'America/Los_Angeles'
    - cron: '23 14 * * *'
      timezone: 'America/Los_Angeles'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/daily-nhl-schedule.yml'
      - 'scripts/update_nhl_schedule.py'

permissions:
  contents: write

concurrency:
  group: frozen-root-nhl-schedule
  cancel-in-progress: false

jobs:
  update-nhl-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Frozen Root site
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch today's NHL games, without generating picks
        run: python scripts/update_nhl_schedule.py
      - name: Publish NHL slate only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nhl-schedule.json
          if git diff --cached --quiet; then
            echo "NHL schedule unchanged"
            exit 0
          fi
          git commit -m "Refresh NHL daily games — pick pending (NHL only)"
          git pull --rebase origin main
          git push origin main
